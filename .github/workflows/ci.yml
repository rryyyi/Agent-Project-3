name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev,mcp,redis]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest --cov=mtr_agent --cov-report=term-missing --cov-report=xml
      - run: mtr-agent evaluate --output artifacts/evaluation.json
      - run: mtr-agent demo > artifacts/demo.json
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: validation-python-${{ matrix.python }}
          path: |
            artifacts/
            coverage.xml
            dist/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t mtr-agent:ci .
      - run: docker run --rm mtr-agent:ci mtr-agent chat 'Central to Hung Hom'
