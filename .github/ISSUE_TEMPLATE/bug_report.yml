name: Bug report
description: Report a reproducible implementation problem
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, OS, project commit, enabled optional adapters. Do not include secrets.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal command/input and observed result. Use synthetic data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
